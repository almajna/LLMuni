[project]
name = "llmuni"
version = "0.1.0"
description = "LLMuni: can LLMs ride Muni? A live benchmark of LLM errand-day planning on SF transit, graded against an exact oracle."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas>=1.0",
    "highspy>=1.7",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opening-hours-py>=2.1",
    "osmium>=4.0",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "r5py>=1.1",
    "rapidfuzz>=3.6",
    "shapely>=2.0",
    "tenacity>=8.2",
]

[project.scripts]
llmuni = "llmuni.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmuni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
